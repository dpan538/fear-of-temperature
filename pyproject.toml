[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fear-temperature"
version = "0.2.0"
description = "Reproducible NLP and temporal-analysis infrastructure for warming-related discourse research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Dai Pan" }]
dependencies = [
  "duckdb>=1.2,<2",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "seaborn>=0.13,<1",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
nlp = [
  "bertopic>=0.16,<1",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "huggingface-hub>=0.27,<2",
  "safetensors>=0.4,<1",
  "sentence-transformers>=3.3,<6",
  "spacy>=3.8,<3.9",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
]
notebook = [
  "ipykernel>=6.29,<8",
  "ipywidgets>=8.1,<9",
  "jupyterlab>=4.3,<5",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "nbformat>=5.10,<6",
]
viz = ["plotly>=5.24,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
legacy = ["pdfplumber>=0.11,<1", "pillow>=12,<13"]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-pyyaml>=6,<7",
]

[project.scripts]
fear-temperature-demo = "fear_temperature.pipeline:main"
fear-temperature-doctor = "fear_temperature.doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fear_temperature"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["models: requires downloaded NLP model weights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["fear_temperature"]
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev"]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]
