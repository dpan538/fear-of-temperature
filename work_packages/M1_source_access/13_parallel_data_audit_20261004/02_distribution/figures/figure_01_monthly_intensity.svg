  <g id="text_22">
   <text style="font-size: 7.6px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #637485" x="53.064" y="370.1772" transform="rotate(-0 53.064 370.1772)">Source data: monthly_source_genre_counts.csv. Source checkpoints differ; this chart does not infer an event or cross-source rate.</text>
