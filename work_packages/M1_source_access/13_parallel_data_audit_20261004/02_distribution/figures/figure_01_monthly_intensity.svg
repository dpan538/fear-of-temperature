  <g id="text_20">
   <text style="font-size: 8.2px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #637485" x="173.664" y="316.6344" transform="rotate(-0 173.664 316.6344)">Examples: 1999/2000 September Commons recesses; 2013 April DEFRA policy-series cluster; sparse 1994 US selected metadata.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 7.6px; font-family: 'DejaVu Sans', sans-serif; text-anchor: start; fill: #637485" x="53.064" y="360.162" transform="rotate(-0 53.064 360.162)">Study publication interval: 1988-01-01–2026-09-21. September 2026 is partial. Zero means zero in the defined source frame.</text>
