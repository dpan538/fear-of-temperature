<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Fear of Temperature end-to-end technical workflow</title>
  <desc id="desc">Policy, media and public sources pass through denominator audit, database cleaning, Transformer encoding, NLP tasks, validation and aggregation before addressing three research questions. Original evidence remains linked throughout.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#50615b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16241f" flood-opacity="0.10"/></filter>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#17251f}.sub{font:400 16px Arial,sans-serif;fill:#61706a}
      .stage{font:700 18px Arial,sans-serif;fill:#17251f}.body{font:400 14px Arial,sans-serif;fill:#40504a}
      .white{font:700 17px Arial,sans-serif;fill:white}.small{font:600 12px Arial,sans-serif;fill:#61706a;letter-spacing:.04em}
    </style>
  </defs>
  <rect width="1400" height="650" rx="28" fill="#fbfaf6"/>
  <text x="48" y="54" class="title">From source denominators to research interpretation</text>
  <text x="48" y="82" class="sub">Purple = policy, blue = media, green = public. Dashed stages are planned; only the bounded M1.1 source audit is completed.</text>

  <g filter="url(#shadow)">
    <rect x="50" y="126" width="180" height="60" rx="13" fill="#6D3A8E"/>
    <rect x="50" y="196" width="180" height="60" rx="13" fill="#2F6FBD"/>
    <rect x="50" y="266" width="180" height="60" rx="13" fill="#2E8B57"/>
  </g>
  <text x="140" y="163" text-anchor="middle" class="white">Government / policy</text>
  <text x="140" y="233" text-anchor="middle" class="white">News media</text>
  <text x="140" y="303" text-anchor="middle" class="white">Public expression</text>

  <line x1="230" y1="226" x2="285" y2="226" stroke="#50615b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="295" y="142" width="190" height="168" rx="18" fill="#fff" stroke="#6D3A8E" stroke-width="3"/></g>
  <text x="390" y="178" text-anchor="middle" class="stage">Sources + denominator</text>
  <text x="390" y="208" text-anchor="middle" class="body">institution · type · date</text>
  <text x="390" y="232" text-anchor="middle" class="body">access · rights · N_total</text>
  <rect x="330" y="256" width="120" height="28" rx="14" fill="#e9dff0"/>
  <text x="390" y="275" text-anchor="middle" class="small" fill="#6D3A8E">M1.1 COMPLETED</text>

  <line x1="485" y1="226" x2="535" y2="226" stroke="#50615b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="545" y="142" width="190" height="168" rx="18" fill="#fff" stroke="#9baba4" stroke-width="2" stroke-dasharray="7 6"/></g>
  <text x="640" y="178" text-anchor="middle" class="stage">Database + cleaning</text>
  <text x="640" y="208" text-anchor="middle" class="body">metadata · deduplication</text>
  <text x="640" y="232" text-anchor="middle" class="body">passages · versions</text>
  <text x="640" y="274" text-anchor="middle" class="small">PLANNED</text>

  <line x1="735" y1="226" x2="785" y2="226" stroke="#50615b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="795" y="142" width="190" height="168" rx="18" fill="#fff" stroke="#9baba4" stroke-width="2" stroke-dasharray="7 6"/></g>
  <text x="890" y="178" text-anchor="middle" class="stage">Transformer encoding</text>
  <text x="890" y="208" text-anchor="middle" class="body">Sentence-BERT candidate</text>
  <text x="890" y="232" text-anchor="middle" class="body">semantic + lexical retrieval</text>
  <text x="890" y="274" text-anchor="middle" class="small">CHECKPOINT NOT FROZEN</text>

  <line x1="985" y1="226" x2="1035" y2="226" stroke="#50615b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="1045" y="112" width="300" height="74" rx="15" fill="#fff" stroke="#9baba4" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="1045" y="198" width="300" height="74" rx="15" fill="#fff" stroke="#9baba4" stroke-width="2" stroke-dasharray="7 6"/>
    <rect x="1045" y="284" width="300" height="74" rx="15" fill="#fff" stroke="#9baba4" stroke-width="2" stroke-dasharray="7 6"/>
  </g>
  <text x="1070" y="143" class="stage">Emotion / target / horizon</text><text x="1070" y="166" class="body">holder · negation · future worry</text>
  <text x="1070" y="229" class="stage">Events + relations</text><text x="1070" y="252" class="body">cause · blame · duty · evidence span</text>
  <text x="1070" y="315" class="stage">Topics + frames</text><text x="1070" y="338" class="body">stability · representative and contrary text</text>

  <path d="M1195 358 L1195 402 L980 402" fill="none" stroke="#50615b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="735" y="380" width="235" height="110" rx="18" fill="#fff" stroke="#9baba4" stroke-width="2" stroke-dasharray="7 6"/></g>
  <text x="852" y="414" text-anchor="middle" class="stage">Validation + aggregation</text>
  <text x="852" y="440" text-anchor="middle" class="body">source / period holdout</text><text x="852" y="463" text-anchor="middle" class="body">common windows · S / E / B</text>

  <line x1="735" y1="435" x2="675" y2="435" stroke="#50615b" stroke-width="3" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)"><rect x="330" y="378" width="335" height="115" rx="18" fill="#eef3f0" stroke="#50615b" stroke-width="2"/></g>
  <text x="355" y="412" class="stage">RQ1 · Who changes first?</text><text x="355" y="438" class="stage">RQ2 · What changes around events?</text><text x="355" y="464" class="stage">RQ3 · How is fear explained?</text>

  <rect x="50" y="548" width="1295" height="58" rx="16" fill="#17251f"/>
  <text x="78" y="574" class="white">Evidence spine</text>
  <text x="222" y="574" class="body" fill="#dce6e1">document_id → passage_id → date/source → speaker/holder → evidence span → model version → aggregate → interpretation</text>
  <text x="78" y="596" class="small" fill="#aebbb5">Embeddings are derived representations, not replacements for original text or provenance.</text>
</svg>

